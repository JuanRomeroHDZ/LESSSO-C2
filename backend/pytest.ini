[pytest]
# ==========================================================
# LESSSO C2 — Configuración de pytest
# ==========================================================
# Ejecutar desde backend/:
#   pytest
#   pytest -v
#   pytest --cov=app --cov-report=term-missing
# ==========================================================

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Modo asyncio: auto.
# pytest-asyncio >= 1.0 en modo strict exige marcar CADA test async
# con @pytest.mark.asyncio y cada fixture async con @pytest_asyncio.fixture.
# En modo auto detecta tests y fixtures async automáticamente.
asyncio_mode = auto

# Filtros de warnings: no queremos ruido de libs de terceros
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning

# Salida
addopts =
    -ra
    --strict-markers
    --tb=short
    --disable-warnings
