[package]
name = "app"
version = "0.2.5"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
roxmltree = "0.21.1"
tauri-plugin-notification = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-shell = "2.0.0"
base64 = "0.21.5"
aes-gcm = "0.10.3"
rand = "0.8.5"
libc = "0.2"

# Seguridad — Sprint 2
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }

# Clipboard nativo (WebKitGTK no expone el paste al DOM)
arboard = "3.4"

# Procesamiento de imágenes (BMP → PNG real)
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
