name: Release LESSSO C2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Crear como draft'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
            label: 'linux-x64'
          - platform: 'windows-latest'
            args: ''
            label: 'windows-x64'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            label: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            label: 'macos-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'
          key: ${{ matrix.label }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: ${{ github.ref_name }}
          releaseName: 'LESSSO C2 ${{ github.ref_name }}'
          releaseBody: |
            Release automático de LESSSO C2.

            ## Artefactos

            - **Linux**: `.deb`, `.rpm`, `.AppImage`
            - **Windows**: `.msi`, `.exe`
            - **macOS**: `.dmg` (Intel + Apple Silicon)

            ## Instalación

            ### Linux (Debian/Ubuntu)
            sudo dpkg -i lessso-c2_*_amd64.deb
            sudo apt-get install -f

            ### macOS
            Abrir el `.dmg` y arrastrar a Aplicaciones.
            Si macOS bloquea: clic derecho → Abrir.

            ### Windows
            Ejecutar el `.msi` o el `.exe`.

            ## Dependencias del sistema

            - Linux: `nmap`, `openvpn`, `pkexec`, `wl-clipboard`
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' }}
          prerelease: false
          args: ${{ matrix.args }}
