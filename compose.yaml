# ==========================================================
# LESSSO C2 — Stack completo (API + Postgres + Redis)
# ----------------------------------------------------------
# Este archivo NO contiene secretos. Todas las credenciales
# vienen del archivo .env (que está en .gitignore).
#
# Para levantar el stack:
#   1. cp .env.example .env
#   2. Edita .env con tus credenciales
#   3. docker compose up -d --build
# ==========================================================

name: juanmap-stack

services:
  # ----------------------------------------------------------
  # API — FastAPI (backend)
  # ----------------------------------------------------------
  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    container_name: juanmap_api
    restart: unless-stopped
    ports:
      # ⚠ Bindea solo a 127.0.0.1 (localhost).
      # Se lee del .env como "127.0.0.1:8001"
      - "${API_HOST_PORT}:8000"
    volumes:
      - ./backend:/app
    environment:
      # URLs compuestas (Docker Compose las expande del .env)
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}

      # ------------------------------------------------------
      # NVD (National Vulnerability Database)
      # ------------------------------------------------------
      # Sin estas líneas, la key del .env NO llega al
      # contenedor y `settings.NVD_API_KEY` queda vacío.
      # El `:-` da un valor por defecto si la var no existe.
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_SOFT_FAIL=${NVD_SOFT_FAIL:-true}
      - NVD_TIMEOUT_S=${NVD_TIMEOUT_S:-15}
      - NVD_MAX_RESULTS_PER_ITEM=${NVD_MAX_RESULTS_PER_ITEM:-25}
      - CVE_CACHE_TTL_S=${CVE_CACHE_TTL_S:-86400}
      - CVE_CACHE_REQUIRED=${CVE_CACHE_REQUIRED:-false}

      # ------------------------------------------------------
      # CORS — Orígenes permitidos del frontend
      # ------------------------------------------------------
      # En dev Tauri/Vite. Si accedes desde otro host,
      # añade el tuyo separado por comas.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173,tauri://localhost,http://tauri.localhost}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ----------------------------------------------------------
  # DB — PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: juanmap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # ⚠ Bindea solo a 127.0.0.1 (localhost).
      # Se lee del .env como "127.0.0.1:5433"
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - juanmap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Cache — Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: juanmap_redis
    restart: unless-stopped
    ports:
      # ⚠ Bindea solo a 127.0.0.1 (localhost).
      # Se lee del .env como "127.0.0.1:6380"
      - "${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  juanmap_pgdata: {}
